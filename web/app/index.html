<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>OG Paper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f3ec; overscroll-behavior: none; }
  /* dvh = the height actually visible between the browser's toolbars; the
     safe-area insets keep the corner buttons clear of notches/home bars. */
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none;
           width: calc(100vw - env(safe-area-inset-right));
           height: calc(100vh - env(safe-area-inset-bottom));
           height: calc(100dvh - env(safe-area-inset-bottom)); }
  /* Dark mode (the app flips its own drawing): the page, and everything
     drawn over the canvas, get the same flip - lightness reversed, hues kept. */
  html.dark, html.dark body { background: #0e0d0a; }
  html.dark body > :not(canvas):not(script) { filter: invert(1) hue-rotate(180deg); }
</style>
</head>
<body>
<script type="module">
  // The canvas plus bookmarks, timeline, offline copies and browser autosave.
  import { start } from './og-web.js';
  start({ mode: 'app' });

  // Installable app (Add to Home screen): opens with no browser bars.
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

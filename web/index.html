<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OG Paper — zoom spike</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f3ec; font: 13px/1.4 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  #hud { position: fixed; left: 12px; top: 12px; padding: 8px 10px; background: rgba(255,255,255,.85);
         border: 1px solid #ddd; border-radius: 8px; white-space: pre; color: #222; pointer-events: none; max-width: calc(100vw - 48px); overflow: hidden; }
  #help { position: fixed; left: 12px; bottom: 12px; padding: 8px 10px; background: rgba(255,255,255,.85);
          border: 1px solid #ddd; border-radius: 8px; color: #444; pointer-events: none; }
  @media (prefers-color-scheme: dark) { #hud, #help { background: rgba(30,30,34,.85); color: #eee; border-color: #444; } }
</style>
</head>
<body>
<div id="hud">Building the test canvas (250,000 strokes + a zoom chain 10^48 deep)…</div>
<div id="help">
  <b>Mouse</b>: wheel zoom · right/middle-drag pan · left-drag draw · <b>A</b> auto-zoom · <b>H</b> home<br>
  <b>Touch</b>: 1 finger pan · pinch zoom · double-tap auto-zoom<br>
  URL options: <code>?mass=1000000</code> · <code>?chain=25</code> (start deep)
</div>
<script type="module">
  import init from './pkg/og_spike.js';
  // Let the loading text paint before the (blocking) canvas build starts.
  requestAnimationFrame(() => setTimeout(async () => {
    try { await init(); } catch (e) { document.getElementById('hud').textContent = 'Failed: ' + e; }
    // Keyboard shortcuts need the canvas focused.
    document.addEventListener('pointerdown', () => { const c = document.querySelector('canvas'); if (c) { c.tabIndex = 0; c.focus(); } });
  }, 30));
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="../app/icon-192.png">
<link rel="apple-touch-icon" href="../app/icon-192.png">
<title>OG Paper — Try mode</title>
<meta name="description" content="Try the OG Paper infinite canvas in your browser: a demo canvas 10^45 deep, bookmarks, a timeline and offline copies.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f3ec; overscroll-behavior: none; }
  /* dvh = the height actually visible between the browser's toolbars; the
     safe-area insets keep the corner buttons clear of notches/home bars. */
  canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none;
           width: calc(100vw - env(safe-area-inset-right));
           height: calc(100vh - env(safe-area-inset-bottom));
           height: calc(100dvh - env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<script type="module">
  // Try mode: the real app, starting on a demo canvas with a guided tour.
  // Drawings autosave in this browser, separately from /app/.
  import { start } from '../app/og-web.js';
  start({ mode: 'try' });
</script>
</body>
</html>

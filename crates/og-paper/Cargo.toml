[package]
name = "og-paper"
version = "0.1.0"
description = "OG Paper: an open-source infinite canvas"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "og-paper"
path = "src/main.rs"

[dependencies]
ogpaper-core = { path = "../ogpaper-core" }
num-bigint = "0.4"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
web-time = "1"
miniz_oxide = "0.8"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sha2 = { version = "0.10", default-features = false }
serde_json = "1"
wasmi = { version = "0.40", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
hayro = "0.7"
pollster = "0.4"
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
ogpaper-file = { path = "../ogpaper-file" }
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
env_logger = "0.11"
rfd = "0.15"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
egui-winit = { version = "0.36", default-features = false, features = ["links", "clipboard", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = ["Window", "MediaQueryList", "HtmlCanvasElement", "Storage"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
egui-winit = { version = "0.36", default-features = false, features = ["links", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }

[package.metadata.android]
package = "app.ogpaper"
apk_name = "og-paper"
build_targets = ["aarch64-linux-android"]
# Launcher icons (packaging/make-icons.py writes them).
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 34

[package.metadata.android.application]
label = "OG Paper"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
orientation = "unspecified"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|density"

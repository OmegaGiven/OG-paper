[workspace]
resolver = "2"
members = ["crates/ogpaper-core", "crates/ogpaper-file", "crates/spike", "crates/og-paper"]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
authors = ["OmegaGiven and contributors"]
repository = "https://github.com/OmegaGiven/OG-paper"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"

# winit without its private macOS window-blur API (the Mac App Store
# refuses binaries that reference it; OG Paper never blurs its window).
[patch.crates-io]
winit = { path = "third_party/winit" }

name: Apple release

# The one path to the App Store, run by hand (Actions > Apple release > Run
# workflow). See docs/RELEASING.md.
#
#   1. number   the next build number (one more than App Store Connect's highest)
#   2. ios      runs the app in the iOS Simulator, then builds for iPhone and
#               iPad, signs, validates and uploads it (TestFlight)
#      mac      builds a universal Mac app, launches it in the sandbox, signs,
#               packages, validates and uploads it (TestFlight)
#   3. listing  makes the version in App Store Connect if it isn't there yet,
#               waits for Apple to process the build, attaches it, sets What's
#               New and release = AFTER_APPROVAL (live as soon as Apple approves)
#   4. submit   only with "submit" on: sends the version to App Review
#
# An empty version skips that platform. No Mac needed: GitHub's macOS runners
# build everything. Secrets: docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: iOS version, e.g. 1.2 (empty = no iOS build)
        default: ""
      mac_version:
        description: Mac version, e.g. 1.1 (empty = no Mac build)
        default: ""
      whats_new:
        description: What's New file under packaging/apple/appstore (empty = leave; not on a first version)
        default: whats-new.txt
      notes:
        description: App Review notes file under packaging/apple/appstore (empty = leave)
        default: ""
      upload:
        description: Upload to App Store Connect (off = test, build, sign and validate only)
        type: boolean
        default: true
      submit:
        description: Submit for App Review once the build is attached (release AFTER_APPROVAL: live as soon as Apple approves)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-release
  cancel-in-progress: false

env:
  ASC_KEY: ${{ secrets.APPLE_API_KEY }}
  ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

jobs:
  number:
    name: Next build number
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.n.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography
      - id: n
        run: |
          set -euo pipefail
          n=$(cd packaging/apple/asc && python3 next_build.py)
          echo "build $n"
          echo "build=$n" >> "$GITHUB_OUTPUT"

  ios-simulator:
    name: iOS runs in the Simulator
    if: inputs.ios_version != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-sim
      - name: Build for the Simulator
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --release -p og-paper --bin og-paper --target aarch64-apple-ios-sim
      - name: Assemble
        run: |
          packaging/apple/ios/assemble.sh target/aarch64-apple-ios-sim/release/og-paper \
            "build/sim/OG Paper.app" iphonesimulator "${{ inputs.ios_version }}" 1
          codesign --force --sign - "build/sim/OG Paper.app"
      - name: Launch and screenshot
        run: |
          set -euo pipefail
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[5-9] Pro|iPhone 1[5-9]|iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "build/sim/OG Paper.app"
          mkdir -p shots
          xcrun simctl launch --stdout="$PWD/shots/stdout.txt" --stderr="$PWD/shots/stderr.txt" "$DEV" com.omegagiven.ogpaper
          sleep 6
          xcrun simctl io "$DEV" screenshot shots/after-6s.png
          sleep 14
          xcrun simctl io "$DEV" screenshot shots/launched.png
          echo "--- app stderr"; tail -60 shots/stderr.txt || true
          # Still running (not crashed)?
          xcrun simctl spawn "$DEV" launchctl list | grep -i ogpaper || { echo "::error::the app is not running"; xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "og-paper"' | tail -80; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: shots/

  ios:
    name: iOS build, sign, upload
    needs: [number, ios-simulator]
    if: inputs.ios_version != ''
    runs-on: macos-latest
    env:
      APP: build/ios/Payload/OG Paper.app
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build for iPhone and iPad
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --release -p og-paper --bin og-paper --target aarch64-apple-ios
      - name: Signing keychain
        env:
          DIST_P12: ${{ secrets.APPLE_DIST_CERTIFICATE }}
          DIST_PW: ${{ secrets.APPLE_DIST_CERTIFICATE_PASSWORD }}
          KC_PW: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KC_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$DIST_P12" | base64 --decode > dist.p12
          security import dist.p12 -k build.keychain -P "$DIST_PW" -T /usr/bin/codesign
          rm dist.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" build.keychain
      - name: Assemble and sign
        env:
          PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE }}
          IDENTITY: ${{ secrets.APPLE_DIST_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          packaging/apple/ios/assemble.sh target/aarch64-apple-ios/release/og-paper "$APP" iphoneos \
            "${{ inputs.ios_version }}" "${{ needs.number.outputs.build }}"
          echo "$PROFILE" | base64 --decode > "$APP/embedded.mobileprovision"
          codesign --force --timestamp --entitlements packaging/apple/ios/OGPaper.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          (cd build/ios && zip -qry ../../OGPaper.ipa Payload)
          ls -la OGPaper.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OGPaper-ipa
          path: OGPaper.ipa
          retention-days: 14
      - name: Validate and upload
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --validate-app -f OGPaper.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
          if [ "${{ inputs.upload }}" = "true" ]; then
            xcrun altool --upload-app -f OGPaper.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
          fi

  mac:
    name: Mac build, launch test, sign, upload
    needs: number
    if: inputs.mac_version != ''
    runs-on: macos-latest
    env:
      APP: dist/OG Paper.app
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (universal)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release -p og-paper --target aarch64-apple-darwin
          cargo build --release -p og-paper --target x86_64-apple-darwin
      - name: Signing keychain
        env:
          DIST_P12: ${{ secrets.APPLE_DIST_CERTIFICATE }}
          DIST_PW: ${{ secrets.APPLE_DIST_CERTIFICATE_PASSWORD }}
          INST_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          INST_PW: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          KC_PW: ${{ github.run_id }}${{ github.run_attempt }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KC_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$DIST_P12" | base64 --decode > dist.p12
          echo "$INST_P12" | base64 --decode > inst.p12
          security import dist.p12 -k build.keychain -P "$DIST_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import inst.p12 -k build.keychain -P "$INST_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm dist.p12 inst.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PW" build.keychain
          security find-identity -v build.keychain
      - name: Assemble the app
        env:
          PROFILE: ${{ secrets.APPLE_MAC_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/og-paper" \
            target/aarch64-apple-darwin/release/og-paper target/x86_64-apple-darwin/release/og-paper
          # Private APIs App Review has refused (Guideline 2.5.1): fail here first.
          if nm -u "$APP/Contents/MacOS/og-paper" | grep -E "_CGS[A-Z]|_CGSSetWindowBackgroundBlurRadius"; then
            echo "::error::the binary references private CoreGraphics (CGS) APIs"; exit 1
          fi
          sed -e "s/__VERSION__/${{ inputs.mac_version }}/" -e "s/__BUILD__/${{ needs.number.outputs.build }}/" \
            packaging/apple/macos/Info.plist.in > "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          # The icon: an asset catalog (Assets.car) and AppIcon.icns.
          SET=build/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$SET"
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/apple/icon-mac-1024.png --out "$SET/icon_${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d packaging/apple/icon-mac-1024.png --out "$SET/icon_${s}@2x.png" >/dev/null
          done
          python3 - "$SET" <<'PY'
          import json, sys
          images = []
          for s in (16, 32, 128, 256, 512):
              for k, suffix in ((1, ""), (2, "@2x")):
                  images.append({"idiom": "mac", "size": f"{s}x{s}", "scale": f"{k}x",
                                 "filename": f"icon_{s}{suffix}.png"})
          json.dump({"images": images, "info": {"version": 1, "author": "og-paper"}},
                    open(sys.argv[1] + "/Contents.json", "w"), indent=1)
          json.dump({"info": {"version": 1, "author": "og-paper"}},
                    open(sys.argv[1] + "/../Contents.json", "w"))
          PY
          xcrun actool build/Assets.xcassets --compile "$APP/Contents/Resources" \
            --platform macosx --minimum-deployment-target 11.0 --app-icon AppIcon \
            --output-partial-info-plist build/icon-info.plist
          echo "$PROFILE" | base64 --decode > "$APP/Contents/embedded.provisionprofile"
      - name: Launch test (sandboxed, clean container)
        timeout-minutes: 5
        run: bash tests/launch/mac-launch.sh "$APP" launch-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-launch-test
          path: launch-test/
          retention-days: 14
      - name: Sign
        env:
          IDENTITY: ${{ secrets.APPLE_DIST_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime \
            --entitlements packaging/apple/macos/OGPaper.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
      - name: Package
        env:
          IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          productbuild --component "$APP" /Applications --sign "$IDENTITY" OGPaper-appstore.pkg
          pkgutil --check-signature OGPaper-appstore.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: OGPaper-appstore-pkg
          path: OGPaper-appstore.pkg
          retention-days: 14
      - name: Validate and upload
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --validate-app -f OGPaper-appstore.pkg -t macos --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
          if [ "${{ inputs.upload }}" = "true" ]; then
            xcrun altool --upload-app -f OGPaper-appstore.pkg -t macos --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
          fi

  listing:
    name: App Store Connect
    needs: [number, ios, mac]
    # Runs when every platform asked for built and uploaded (a skipped
    # platform is fine).
    if: >-
      always() && inputs.upload &&
      needs.number.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography
      - name: Prepare each version
        run: |
          set -euo pipefail
          cd packaging/apple/asc
          for pv in "IOS ${{ inputs.ios_version }}" "MAC_OS ${{ inputs.mac_version }}"; do
            set -- $pv
            [ -n "${2:-}" ] || continue
            args=(--platform "$1" --version "$2" --create --release AFTER_APPROVAL
                  --build "${{ needs.number.outputs.build }}" --wait 5400)
            if [ -n "${{ inputs.whats_new }}" ]; then args+=(--whats-new "../appstore/${{ inputs.whats_new }}"); fi
            if [ -n "${{ inputs.notes }}" ]; then args+=(--notes "../appstore/${{ inputs.notes }}"); fi
            echo "== $1 $2"
            python3 listing.py "${args[@]}"
          done
      - name: Submit for App Review
        if: inputs.submit
        run: |
          set -euo pipefail
          cd packaging/apple/asc
          for pv in "IOS ${{ inputs.ios_version }}" "MAC_OS ${{ inputs.mac_version }}"; do
            set -- $pv
            [ -n "${2:-}" ] || continue
            echo "== $1 $2"
            python3 submit.py --platform "$1" --version "$2"
          done
      - name: Status
        if: always()
        run: python3 packaging/apple/asc/status.py

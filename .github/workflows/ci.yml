name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: core tests + spike build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p ogpaper-core
      - run: cargo build --release -p og-spike

  android:
    name: spike APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-apk --locked
      - name: Build APK (debug-signed)
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
          export CARGO_APK_RELEASE_KEYSTORE=$PWD/debug.keystore CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          cargo apk build -p og-spike --release --lib
      - uses: actions/upload-artifact@v4
        with:
          name: og-spike-apk
          path: target/release/apk/og-spike.apk

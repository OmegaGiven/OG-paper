[package]
name = "og-paper-diagram-symbols"
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
description = "An OG Paper plugin: tools that place flowchart, electrical and mechanical symbols"

# Built on its own (not part of the app's workspace):
#   cargo build --release --target wasm32-unknown-unknown
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
